name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (leave blank to use version from app/build.gradle.kts)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: python3 -c "import base64, os; open('my-release-key.jks', 'wb').write(base64.b64decode(os.environ['KEYSTORE_BASE64'].strip()))"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Determine Version & Prepare Artifact
        id: prepare_artifact
        run: |
          if [ -f app/build/outputs/apk/release/output-metadata.json ]; then
            VERSION=$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)
          else
            VERSION=$(grep -E 'versionName' app/build.gradle.kts | head -1 | awk -F '"' '{print $2}')
          fi

          echo "Detected version: $VERSION"

          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$VERSION"
          fi

          echo "Release tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK_SRC" "AnkiPrep-${TAG}.apk"
          echo "artifact_path=AnkiPrep-${TAG}.apk" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_artifact.outputs.artifact_path }}
          path: ${{ steps.prepare_artifact.outputs.artifact_path }}
          retention-days: 30

      - name: Extract Release Notes from CHANGELOG.md
        id: extract_notes
        run: |
          python3 -c "
          import re, os
          ver = os.environ.get('CLEAN_VER', '').lstrip('v')
          if os.path.exists('CHANGELOG.md'):
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  text = f.read()
              pattern = rf'## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              match = re.search(pattern, text, re.DOTALL)
              if match:
                  notes = match.group(1).strip().rstrip('-').strip()
                  with open('release_notes.md', 'w', encoding='utf-8') as out:
                      out.write(notes)
                  print('Found release notes for version ' + ver)
                  exit(0)
          print('No specific release notes found in CHANGELOG.md for ' + ver)
          "
          if [ -f release_notes.md ]; then
            echo "has_notes=true" >> $GITHUB_OUTPUT
          else
            echo "has_notes=false" >> $GITHUB_OUTPUT
          fi
        env:
          CLEAN_VER: ${{ steps.prepare_artifact.outputs.version }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_artifact.outputs.tag }}
          name: "AnkiPrep ${{ steps.prepare_artifact.outputs.tag }}"
          files: ${{ steps.prepare_artifact.outputs.artifact_path }}
          body_path: ${{ steps.extract_notes.outputs.has_notes == 'true' && 'release_notes.md' || '' }}
          generate_release_notes: ${{ steps.extract_notes.outputs.has_notes != 'true' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
