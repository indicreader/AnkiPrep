name: Build & Release APK

on:
  push:
    tags:
      - 'v*'            # Trigger on version tags e.g. v4.61
  workflow_dispatch:    # Allow manual trigger from GitHub Actions UI

jobs:
  build:
    name: Build Signed APK & Upload to Release
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. JDK 17 ─────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # ── 3. Decode keystore ────────────────────────────────────────────────
      - name: Decode Keystore File
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-release-key.jks
          else
            echo "Warning: KEYSTORE_BASE64 not set — using debug key placeholder"
            touch my-release-key.jks
          fi

      # ── 4. Gradle permissions ─────────────────────────────────────────────
      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      # ── 5. Build signed release APK ───────────────────────────────────────
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # ── 6. Extract version name from build.gradle.kts ─────────────────────
      - name: Get Version Name
        id: get_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # Manual dispatch: read versionName from gradle file
            VER=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
            TAG="v${VER}-build${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # ── 7. Rename APK ─────────────────────────────────────────────────────
      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "AnkiPrep-${{ steps.get_version.outputs.tag }}.apk"

      # ── 8. Create GitHub Release & upload APK ────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: AnkiPrep ${{ steps.get_version.outputs.tag }}
          body: |
            ## AnkiPrep ${{ steps.get_version.outputs.tag }}

            Signed release build. Minimum Android 8.0 (API 26).

            ### How to Install
            1. Download `AnkiPrep-*.apk` below
            2. On your device: **Settings → Security → Install unknown apps** → enable for your browser/Files app
            3. Open the downloaded APK to install
          draft: false
          prerelease: false
          files: AnkiPrep-${{ steps.get_version.outputs.tag }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
