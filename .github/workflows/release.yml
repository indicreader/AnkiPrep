name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (leave blank to use version from app/build.gradle.kts)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Determine Version & Prepare Artifact
        id: prepare_artifact
        run: |
          if [ -f app/build/outputs/apk/release/output-metadata.json ]; then
            VERSION=$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)
          else
            VERSION=$(grep -E 'versionName' app/build.gradle.kts | head -1 | awk -F '"' '{print $2}')
          fi

          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi
          echo "Detected version: $VERSION"

          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$VERSION"
          fi

          echo "Release tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_SRC" ]; then
            echo "::error::No APK file found in app/build/outputs/apk/release!"
            exit 1
          fi

          DEST_NAME="AnkiPrep-${TAG}.apk"
          cp "$APK_SRC" "$DEST_NAME"
          echo "artifact_path=$DEST_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnkiPrep-${{ steps.prepare_artifact.outputs.tag }}-build
          path: ${{ steps.prepare_artifact.outputs.artifact_path }}
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_artifact.outputs.tag }}
          name: "AnkiPrep ${{ steps.prepare_artifact.outputs.tag }}"
          files: ${{ steps.prepare_artifact.outputs.artifact_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
